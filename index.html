<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#14171c;--mu:#6b7280;--ac:#ff6a2b;--ok:#16a34a;--bd:#e3e5e9;--in:#eef0f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}input{user-select:text}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif;padding:12px 12px 96px;overscroll-behavior:none}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 6px}
#v{animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wr{flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--in);border:0;border-radius:12px;padding:10px 14px;min-height:44px;transition:transform .1s}button:active{transform:scale(.95)}
button.p{background:var(--ac);color:#fff;font-weight:700;width:100%;min-height:50px;font-size:17px}button.g{background:none;color:var(--mu)}button.d{color:#dc2626}
.chip{padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;min-height:38px}.chip.on{background:var(--ac);color:#fff}

input,select{font:inherit;color:var(--tx);background:var(--in);border:0;border-radius:10px;padding:10px;min-width:0;width:100%}.n{width:56px;text-align:center;padding:10px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border-radius:0;padding:8px 2px;color:var(--mu);font-size:11px;line-height:1.2}nav button b{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
#rt{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--ac);color:#fff;border-radius:14px;padding:8px 14px;display:none;justify-content:space-between;align-items:center;z-index:9;font-weight:700}#rt button{background:#fff3;color:#fff}
.hero{background:linear-gradient(135deg,#ff6a2b,#ff3d6e);color:#fff;border:0}.hero .mu{color:#ffffffcc}.hero button.p{background:#fff;color:#e8501a}
.ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--ok) var(--p),var(--in) 0);display:grid;place-items:center;position:relative;flex:none}.ring::before{content:"";position:absolute;inset:10px;background:var(--cd);border-radius:50%}.ring b{position:relative;font-size:30px}
.bar{height:10px;background:var(--in);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.w{background:#f59e0b22;border:1px solid #f59e0b;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}
.col{display:flex;align-items:flex-end;gap:6px;height:80px}.col div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.col i{display:block;background:var(--ac);border-radius:5px 5px 0 0;margin-bottom:3px;min-height:3px}
#sp{position:fixed;inset:0;background:linear-gradient(135deg,#ff6a2b,#ff3d6e);z-index:99;display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .4s}#sp div{font-size:56px;animation:pop .7s}#sp b{display:block;font-size:26px;letter-spacing:1px}@keyframes pop{from{transform:scale(.3);opacity:0}}
#md{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end}#md>div{background:var(--cd);width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:fi .25s}
.stat{flex:1;text-align:center;background:var(--in);border-radius:12px;padding:10px 2px}.stat b{display:block;font-size:22px}
.tc{border:2px solid var(--bd);background:var(--cd);width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}.tc.on{border-color:var(--ac)}
html:root:root{--bg:#000;--cd:#121212;--tx:#fff;--mu:#9b9b9b;--ac:#ff2b2b;--ok:#ff2b2b;--bd:#262626;--in:#1e1e1e;color-scheme:dark}h1,h2{text-transform:uppercase;letter-spacing:.5px;font-weight:800}.hero{background:linear-gradient(160deg,#3a0000,#000 75%);border:1px solid #4a0d0d}.hero button.p{background:var(--ac);color:#fff}#sp{background:#000}nav button{font-size:10px}nav button b{font-size:19px}button.p{letter-spacing:.5px;text-transform:uppercase}.set.miss{border-color:#f59e0b;color:#f59e0b;background:#f59e0b22}
html:root:root{--bg:#f3efe6;--cd:#faf7f0;--tx:#222;--mu:#8b857a;--ac:#b8392b;--ok:#b8392b;--bd:#ddd6c8;--in:#ece7db;color-scheme:light}
@media (prefers-color-scheme:dark){html:root:root:not([data-theme="light"]){--bg:#171613;--cd:#1e1d19;--tx:#e9e5dc;--mu:#8d887e;--ac:#d4553f;--ok:#d4553f;--bd:#2d2b26;--in:#26241f;color-scheme:dark}}
html:root:root[data-theme="dark"]{--bg:#171613;--cd:#1e1d19;--tx:#e9e5dc;--mu:#8d887e;--ac:#d4553f;--ok:#d4553f;--bd:#2d2b26;--in:#26241f;color-scheme:dark}
body{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;letter-spacing:.02em;max-width:560px;margin:0 auto;font-weight:400}
h1,h2{text-transform:none;letter-spacing:.04em;font-weight:500}h1{font-size:21px}h2{font-size:15px}
.c{border-radius:3px;background:var(--cd);border:1px solid var(--bd)}
button{border-radius:3px;font-weight:400}button.p{background:var(--tx);color:var(--bg);text-transform:none;letter-spacing:.06em;font-weight:500;font-size:16px;min-height:48px}
.hero{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-left:3px solid var(--ac)}.hero .mu{color:var(--mu)}.hero button.p{background:var(--tx);color:var(--bg)}
.chip{border-radius:2px;border:1px solid var(--bd);background:none;font-size:13px}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input,select{background:var(--cd);border:1px solid var(--bd);border-radius:3px}
.stat{background:none;border:1px solid var(--bd);border-radius:3px}.stat b{font-weight:500}
.bar{height:4px;border-radius:0}.bar i{border-radius:0}
.set{background:none;border-color:var(--bd);font-weight:400}.set.on{background:var(--ac);border-color:var(--ac);color:#fff}.set.miss{border-color:#b8a06a;color:#9a8450;background:#b8a06a22}
.w{background:var(--in);border:0;border-left:3px solid var(--ac);border-radius:0}
#rt{background:var(--tx);color:var(--bg);border-radius:3px}#rt button{background:#8884;color:var(--bg)}
#md>div{border-radius:6px 6px 0 0;background:var(--cd)}
.tc{border-radius:3px}.tc.on{border-color:var(--tx)}
nav{background:var(--bg);border-top:1px solid var(--bd)}nav button{color:var(--mu);font-size:10px;letter-spacing:.08em}nav button.on{color:var(--tx);font-weight:500}nav button b{display:none}
nav button::before{display:block;font-size:19px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;margin-bottom:2px}nav button.on::before{color:var(--ac)}
nav [data-t="home"]::before{content:"今"}nav [data-t="work"]::before{content:"稽"}nav [data-t="skills"]::before{content:"技"}nav [data-t="coach"]::before{content:"導"}nav [data-t="rec"]::before{content:"休"}nav [data-t="prog"]::before{content:"進"}
button[data-a="skai"]{font-size:0}button[data-a="skai"]::after{content:"導";font-size:17px;font-family:serif;color:var(--mu)}
#sp{background:var(--bg);color:var(--tx)}#sp div{font-size:72px;font-weight:300;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;animation:fi .8s}#sp b{font-size:13px;letter-spacing:.5em;font-weight:400;font-family:system-ui,sans-serif;margin-top:8px}
#lk{position:fixed;inset:0;background:var(--bg);z-index:98;display:none;align-items:center;justify-content:center}#lk button[data-pk]{background:var(--cd);border:1px solid var(--bd)}#lk button.g{border:0;background:none}
nav [data-t="ladder"]::before{content:"段"}
nav button::before{font-family:"Noto Sans Devanagari","Devanagari Sangam MN",Mangal,system-ui,sans-serif;font-size:15px;margin-bottom:3px;letter-spacing:0}
nav [data-t="home"]::before{content:"गृह"}nav [data-t="work"]::before{content:"व्यायाम"}nav [data-t="skills"]::before{content:"कौशल"}nav [data-t="coach"]::before{content:"गुरु"}nav [data-t="ladder"]::before{content:"सोपान"}nav [data-t="prog"]::before{content:"प्रगति"}
button[data-a="skai"]::after{content:"गुरु";font-size:12px;font-family:system-ui,"Noto Sans Devanagari",sans-serif}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
body{background-image:radial-gradient(rgba(128,128,128,.10) 1px,transparent 1px);background-size:16px 16px}
.set{transition:transform .12s,background .2s}.set.on{animation:pop .3s}.c{transition:border-color .2s}.bar i{transition:width .5s}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:3px;opacity:0;transition:.3s;z-index:60;pointer-events:none;font-size:14px;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}

</style></head><body>
<div id="sp"><div><svg viewBox='0 0 100 100' width='84' height='84' fill='none' stroke='currentColor' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' style='color:var(--ac)'><path d='M50 8 L56 22 L50 32 L44 22 Z' fill='currentColor'/><path d='M50 32 V92'/><path d='M30 20 V34 A20 20 0 0 0 70 34 V20'/><path d='M30 12 L34 22 H26 Z' fill='currentColor'/><path d='M70 12 L74 22 H66 Z' fill='currentColor'/></svg><b>CaliPlan</b></div></div>
<div id="rt"><span id="rtt"></span><span class="row"><button data-a="rplus">+15s</button><button data-a="skip">Skip</button></span></div>
<div id="lk"></div><div id="toast"></div><div id="v"></div><div id="md"><div id="mc"></div></div>
<nav id="nv"><button data-t="home"><b>🏠</b>Home</button><button data-t="work"><b>🏋️</b>Workout</button><button data-t="skills"><b>🏆</b>Skills</button><button data-t="coach"><b>🤖</b>Coach</button><button data-t="ladder"><b>段</b>Steps</button><button data-t="prog"><b>📈</b>Progress</button></nav>
<script>
const K="caliplan2",$=s=>document.querySelector(s);
const MM={push:["push"],pull:["pull"],legs:["legs"],core:["core"],upper:["push","pull"],full:["push","pull","legs","core"]},MG=["push","pull","legs","core"],H={push:44,pull:44,legs:56,core:30},CAP=16;
const E=(n,s,r,t=90)=>({n,s,r,t});
const mk=a=>a.split(",").map(x=>{const[n,s,r,t]=x.split(":");return E(n,+s,+r,+t||90)});
const D=(n,m,a)=>({n,m,e:mk(a)});
const X={pa:"Pike push-ups:4:8,Dips:4:8,Push-ups:4:15:60,Pseudo planche push-ups:3:8",pb:"Wall handstand push-up negatives:4:5:120,Archer push-ups:3:6,Diamond push-ups:3:12:60,Bench dips:3:15:60",
la:"Pull-ups:5:5:120,Australian rows:4:10,Chin-ups:3:6,Hanging knee raises:3:10:60",lb:"Wide pull-ups:4:6:120,Inverted rows:4:12,Negative pull-ups:3:5,Hanging leg raises:3:8",
ga:"Squats:4:20,Bulgarian split squats:4:10,Nordic curl negatives:3:5,Calf raises:4:20:60",gb:"Jump squats:4:12,Reverse lunges:4:12,Glute bridges:4:15:60,V-sit holds (sec):4:15:60"};
const TP={ppl:{n:"Push / Pull / Legs",d:"6 days a week · strength and skills",f:()=>[D("Push A","push",X.pa),D("Pull A","pull",X.la),D("Legs A","legs",X.ga),D("Push B","push",X.pb),D("Pull B","pull",X.lb),D("Legs B","legs",X.gb)]},
ul:{n:"Upper / Lower",d:"4 days a week · balanced",f:()=>[D("Upper A","upper","Pull-ups:4:6:120,Dips:4:8,Pike push-ups:3:8,Australian rows:3:10,Hanging knee raises:3:10:60"),D("Lower A","legs",X.ga),D("Upper B","upper","Wide pull-ups:4:6:120,Archer push-ups:3:6,Chin-ups:3:6,Diamond push-ups:3:12:60,Hanging leg raises:3:8"),D("Lower B","legs",X.gb)]},
fb:{n:"Full Body",d:"3 days a week · beginner friendly",f:()=>[D("Full A","full","Pull-ups:4:6:120,Dips:4:8,Squats:4:20,Hanging knee raises:3:10:60"),D("Full B","full","Chin-ups:4:6:120,Push-ups:4:15,Bulgarian split squats:3:10,V-sit holds (sec):3:15:60"),D("Full C","full","Australian rows:4:10,Archer push-ups:3:6,Reverse lunges:4:12,Hanging leg raises:3:8")]}};
const mp=(k,w)=>({name:TP[k].n,weeks:w,inc:1,deload:true,days:TP[k].f()});
function load(){try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.prog){x.log=x.log.filter(l=>l.t>Date.now()-24192e5);return x}}catch(e){}
return{ob:false,prog:mp("ppl",8),wk:1,day:0,done:{},log:[],hist:[],ses:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),tab="home",pd=0,left=0,tm=null,ot="auto",ow=8;
S.bw=S.bw||[];S.pb=S.pb||{};S.sk=S.sk||{};S.tr=S.tr||{push:0,pull:0,legs:0,core:0};S.tt=S.tt||{};S.t2=S.t2||{};S.at=S.at||{};
const P=()=>S.prog,tgt=e=>e.r,dl=()=>S.wk==P().weeks&&P().deload&&P().weeks>=6,ns=e=>dl()?Math.ceil(e.s*.6):e.s;
const hp=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
function fix(){const p=P();S.wk=Math.min(Math.max(1,S.wk),p.weeks);S.day=Math.min(S.day,p.days.length-1);pd=Math.min(pd,p.days.length-1)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fat(m,n){return S.log.filter(l=>MM[l.m].includes(m)).reduce((a,l)=>a+l.l*Math.pow(.5,(n-l.t)/(H[m]*36e5)),0)}
const rc=m=>Math.round(100-Math.min(100,fat(m,Date.now())/CAP*100)),rdy=ms=>Math.round(ms.reduce((a,m)=>a+rc(m),0)/ms.length);
function hrs(m){const f=fat(m,Date.now()),th=.35*CAP;return f>th?Math.ceil(H[m]*Math.log2(f/th)):0}
function overall(){const s7=S.log.filter(l=>l.t>Date.now()-6048e5).length;return Math.max(0,Math.round(rdy(MG)-Math.min(15,Math.max(0,(s7-80)/3))))}
const lab=s=>s<40?"Fatigued":s<70?"Recovering":"Fresh",col=s=>s<40?"#b5493a":s<70?"#b8a06a":"#6f8a6a";
const dt=t=>new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function dstat(i){const d=P().days[i];let t=0,n=0;d.e.forEach((e,x)=>{t+=ns(e);for(let j=0;j<ns(e);j++)if(S.done[`${S.wk}-${i}-${x}-${j}`])n++});return[n,t]}
function onb(){return`<h1 style="margin-top:20px">Welcome 👋</h1><p class="mu">Pick a starting plan. You can edit every exercise later.</p>
${Object.keys(TP).map(k=>`<button class="tc ${k==ot?"on":""}" data-a="ot" data-k="${k}"><b>${TP[k].n}</b><div class="mu">${TP[k].d}</div></button>`).join("")}
<h2 style="margin-top:14px">Program length</h2><div class="row" style="margin-bottom:16px">${[6,8,10].map(w=>`<button class="chip ${w==ow?"on":""}" data-a="ow" data-k="${w}">${w} weeks</button>`).join("")}</div>
<button class="p" data-a="go">Start training</button>`}
function home(){fix();const p=P(),d=p.days[S.day],sc=overall(),ms=MM[d.m],r=rdy(ms),[n,t]=dstat(S.day);
let best=0,bv=-1;p.days.forEach((x,i)=>{const v=rdy(MM[x.m]);if(v>bv){bv=v;best=i}});
const adv=r>=70?"Recovered. Go for it.":r>=40?"Partly recovered. Train, but keep it a bit lighter.":"Still fatigued.";
const w7=S.log.filter(l=>l.t>Date.now()-6048e5),ss=S.hist.filter(h=>h.t>Date.now()-6048e5),h=new Date().getHours();
return`<h1>${h<12?"Good morning":h<18?"Good afternoon":"Good evening"}</h1>
<div class="c hero"><div class="mu">Week ${S.wk} of ${p.weeks}${dl()?" · deload":""} · ${esc(p.name)}</div><h2 style="font-size:24px;margin:6px 0">${esc(d.n)}</h2><div class="mu">${d.e.length} exercises · ${t} sets · ${esc(d.m)}</div>
<div style="margin:12px 0 0"><button class="p" data-a="start">${n>0&&n<t?"Continue workout":"Start workout"}</button></div></div>


<div class="row"><div class="stat"><b>${ss.length}</b><span class="mu">sessions / 7d</span></div><div class="stat"><b>${w7.length}</b><span class="mu">sets / 7d</span></div><div class="stat"><b>${ss.length?(ss.reduce((a,x)=>a+x.dn,0)/Math.max(1,ss.reduce((a,x)=>a+x.min,0))*10).toFixed(1):"-"}</b><span class="mu">sets / 10 min</span></div></div>
${nextCard()}<div class="c" style="margin-top:10px"><div class="row sp"><b>Program progress</b><span class="mu">${Math.round((S.wk-1)/p.weeks*100)}%</span></div><div class="bar" style="margin-top:8px"><i style="width:${(S.wk-1)/p.weeks*100}%;background:var(--ac)"></i></div></div>`}
function work(){fix();const p=P(),d=p.days[S.day],[n,t]=dstat(S.day),sr=MM[d.m].some(m=>rc(m)<40);
return`<div class="row sp"><h1>${esc(d.n)}</h1><b id="el" style="color:var(--ac);font-size:20px"></b></div>${sndBar()}
<div class="row sp" style="margin-bottom:8px"><button data-a="wm">‹</button><b>Week ${S.wk}/${p.weeks}${dl()?" (deload)":""}</b><button data-a="wp">›</button></div>
<div class="chips">${p.days.map((x,i)=>`<button class="chip ${i==S.day?"on":""}" data-a="day" data-i="${i}">${esc(x.n)}</button>`).join("")}</div>

${warm(d.m)}<div class="c"><div class="row sp"><b>${n}/${t} sets</b><span class="mu">${t?Math.round(n/t*100):0}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${t?n/t*100:0}%;background:var(--ok)"></i></div></div>
${d.e.map((e,i)=>`<div class="c"><h2>${esc(e.n)}</h2><div class="mu" style="margin-bottom:8px">${ns(e)} × ${tgt(e)} · rest ${e.t}s${S.pb[e.n]?" · best "+S.pb[e.n]:""}</div><div class="row wr">${Array.from({length:ns(e)},(_,j)=>`<button class="set ${(S.done[`${S.wk}-${S.day}-${i}-${j}`]||0)>=tgt(e)?"on":S.done[`${S.wk}-${S.day}-${i}-${j}`]?"miss":""}" data-a="set" data-i="${i}" data-j="${j}">${S.done[`${S.wk}-${S.day}-${i}-${j}`]||j+1}</button>`).join("")}</div>${hit(e,i)}</div>`).join("")}
<button class="p" data-a="fin">Finish workout</button>`}
function plan(){fix();const p=P(),d=p.days[pd];
return`<h1>Program</h1>${S.auto?"<div class='w'>Auto plan is on. Exercises and targets update after every workout, so manual edits get overwritten.</div>":""}
<div class="c"><div class="mu">Name</div><input data-f="pname" value="${esc(p.name)}">
<div class="row" style="margin-top:8px"><div style="flex:1"><div class="mu">Length</div><select data-f="pweeks">${[4,6,8,10,12].map(w=>`<option ${w==p.weeks?"selected":""} value="${w}">${w} weeks</option>`).join("")}</select></div>
